<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trazify — Transform images into FreeRiderHD track codes with precision and ease using advanced conversion algorithms.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta property="og:title" content="Trazify — Professional Track Code Generator">
    <meta property="og:description" content="Transform images into FreeRiderHD track codes with precision and ease using advanced conversion algorithms.">
    <meta property="og:image" content="assets/TrazifyLogo.png">
    <meta property="og:type" content="website">
    <title>Trazify</title>
    <link rel="icon" href="assets/TrazifyLogo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/TrazifyLogo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="toastContainer" role="status" aria-live="polite"></div>
    <main id="mainContent">
        <canvas id="previewCanvas" role="img" aria-label="Track preview canvas"></canvas>
        <textarea id="outputField" disabled placeholder="Track code output..." aria-label="Generated track code output"></textarea>
    </main>

    <aside id="sidebar">
        <header id="sidebarHeader">
            <h1 id="mainTitle">Trazify</h1>
            <p id="subtitle">Professional Track Code Generator</p>
        </header>
        
        <div id="description">
            <p>Transform images into FreeRiderHD track codes with precision and ease using advanced conversion algorithms.</p>
        </div>

        <div id="controls">
            <label for="uploadButton" class="upload-label">
                <input type="file" id="uploadButton" accept="image/*" multiple aria-label="Upload images">
            </label>
            <div id="actionRow">
                <button id="btnGenerate" class="primary-btn" aria-label="Generate track code">Generate</button>
                <button id="btnCopy" class="secondary-btn" aria-label="Copy track code to clipboard">Copy</button>
                <button id="btnReset" class="secondary-btn" aria-label="Reset project">Reset</button>
            </div>
            <div id="progressContainer">
                <div id="progressBarTrack" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div id="progressBarFill"></div>
                </div>
                <span id="progressText">0%</span>
                <span id="progressDetail" aria-live="polite"></span>
            </div>
        </div>
        
        <div id="settingsContainer">
            <div class="settings-header">
                <h2>Settings</h2>
            </div>
            <div id="generalSettings"></div>

            <div id="imagesSection" class="settings-section">
                <h3 class="section-title">Images Loaded</h3>
                <div id="imageGallery" class="image-gallery"></div>
            </div>

            <div id="objectsSection">
                <div class="section-divider">
                    <h3 class="section-title">Objects</h3>
                </div>
                <div id="objectsList"></div>
            </div>
        </div>

        <footer id="sidebarFooter">
            <div class="credits-container">
                <p class="credit-text">Based on <a href="https://github.com/ObeyLordGoomy/frhd.js" target="_blank" rel="noopener noreferrer">frhd.js</a> · <a href="https://github.com/Logboy2000/IMG2FRHD" target="_blank" rel="noopener noreferrer">Source</a></p>
                <hr class="credit-divider">
                <p class="credit-text">Developed by <a href="https://www.freeriderhd.com/u/e1h" target="_blank" rel="noopener noreferrer" class="shiny-link">E1H</a></p>
            </div>
        </footer>
    </aside>
    <script src="js/frhd.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
